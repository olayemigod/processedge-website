<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta ───────────────────────────────────────────── -->
    <title>ProcessEdge Solutions — Smart Processes. Better Results.</title>
    <meta name="description" content="ProcessEdge Solutions builds business software for African organisations, including SellerTray mobile commerce, EdgeSuite platform services, payments infrastructure, and industry-focused operational applications." />
    <meta name="author" content="ProcessEdge Solutions" />
    <meta name="theme-color" content="#0056A6" />

    <!-- Route-specific canonical and social URLs are set by PageMeta after hydration. -->

    <!-- ── Favicon & App Icons ────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="1024x1024" href="/brand/processedge-icon.png" />
    <link rel="apple-touch-icon" href="/brand/processedge-icon.png" />

    <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp previews) ──────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="ProcessEdge Solutions" />
    <meta property="og:title"       content="ProcessEdge Solutions — Smart Processes. Better Results." />
    <meta property="og:description" content="ProcessEdge Solutions builds business software including SellerTray mobile commerce, platform services, payments infrastructure, and industry-focused operational applications." />
    <meta property="og:image"       content="https://processedge.com.ng/brand/og-image.png" />
    <meta property="og:image:alt"   content="ProcessEdge Solutions" />
    <meta property="og:locale"      content="en_NG" />

    <!-- ── Twitter Card ──────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@processedgeng" />
    <meta name="twitter:creator"     content="@processedgeng" />
    <meta name="twitter:title"       content="ProcessEdge Solutions — Smart Processes. Better Results." />
    <meta name="twitter:description" content="ProcessEdge Solutions builds business software including SellerTray mobile commerce and industry-focused operational applications." />
    <meta name="twitter:image"       content="https://processedge.com.ng/brand/og-image.png" />
    <meta name="twitter:image:alt"   content="ProcessEdge Solutions" />

    <!-- ── Initial structured data for crawlers before app hydration ─ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://processedge.com.ng/#organization",
        "name": "ProcessEdge Solutions Limited",
        "url": "https://processedge.com.ng",
        "logo": "https://processedge.com.ng/brand/processedge-icon.png",
        "makesOffer": {
          "@type": "Offer",
          "itemOffered": {
            "@type": "SoftwareApplication",
            "@id": "https://sellertray.com/#application",
            "name": "SellerTray",
            "url": "https://sellertray.com",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Android",
            "description": "Mobile-first sales and retail operations software for POS, orders, inventory, customers, payments, branch operations and WhatsApp commerce."
          }
        }
      }
    </script>

    <!-- ── Google Fonts ──────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
